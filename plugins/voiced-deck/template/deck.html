<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Deck title. A full-claim headline.</title>
<!--
  voiced-deck template.

  Two blocks are the engine and stay byte-identical across decks:
    the style with id vd-engine-css and the script with id vd-engine-js.
  Refresh them with `voiced-deck engine-sync deck.html`. Edit everything else.

  Conventions (full guide: skills/voiced-deck/references/deck-design.md):
  - One <section class="slide" id="sN"> per slide, inside #stage, in order.
  - Lay out on a 960x540 grid (16:9). Under 560px the stage is 540x720 (3:4).
    Use calc(var(--u)*px) for every size so the slide scales with the frame.
  - A build is any element with data-b="k" (k = 1, 2, ...). Build k shows on click k.
    Add class "b" for the default fade-up. Builds inside [data-only=wide] or
    [data-only=narrow] count only in that layout.
  - Count-ups: data-count="to" data-from="from" data-pre="$" data-suf="%".
  - Charts: <div class="chart" data-chart="name"> drawn by DECK.charts.name(box, api).
  - The script is #pitch JSON: one entry per slide with "segments". segments[0] plays on
    slide entry and segments[k] after build k, so each slide needs exactly
    (segments.length - 1) builds. Generate it with `voiced-deck script script.md deck.html`.
  - The voice manifest goes between the voice-manifest markers. `voiced-deck embed` writes it.
-->
<style id="vd-engine-css">
:root{color-scheme:light dark}
html,body{margin:0;padding:0;background:transparent}
body{font-family:"Helvetica Neue",Helvetica,var(--font-sans,system-ui),Arial,sans-serif;-webkit-font-smoothing:antialiased}
.deck{
  --fb-card:#fbf8f1;--fb-fg:#1c1b18;--fb-muted:#686358;--fb-border:rgba(28,27,24,.14);
  --c1:#0f8f84;--c2:#c98a00;--c3:#6a5fd0;--mark:#f2c230;--hlmix:58%;--hlh:42%;--warm:7%;
  --card-base:var(--card,var(--fb-card));
  --paper:color-mix(in oklab,var(--card-base) calc(100% - var(--warm)),#f2c230);
  --ink:var(--foreground,var(--fb-fg));
  --muted:var(--muted-foreground,var(--fb-muted));
  --line:var(--border,var(--fb-border));
  --red:var(--destructive,#c8432f);
  --disp:"Helvetica Neue",Helvetica,var(--font-sans,system-ui),Arial,sans-serif;
  --mono:var(--font-mono,ui-monospace),"SF Mono",Menlo,Consolas,monospace;
  --rad:var(--radius,14px);
  color:var(--ink);max-width:100%;
}
@media (prefers-color-scheme:dark){
  .deck:not([data-mode=light]){--fb-card:#161817;--fb-fg:#f1ede4;--fb-muted:#a9a498;--fb-border:rgba(255,255,255,.13);
    --c1:#2aa192;--c2:#c08a10;--c3:#8a80e6;--mark:#e8b62a;--hlmix:85%;--hlh:13%;--warm:4%}
}
.deck[data-mode=dark]{--c1:#2aa192;--c2:#c08a10;--c3:#8a80e6;--mark:#e8b62a;--hlmix:85%;--hlh:13%;--warm:4%;--red:var(--destructive,#e0644f)}
.deck[data-mode=light]{--c1:#0f8f84;--c2:#c98a00;--c3:#6a5fd0;--mark:#f2c230;--hlmix:58%;--hlh:42%;--warm:7%}

.vd-probe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;background:var(--card-base)}
.frame{container-type:inline-size;width:100%;margin:0 auto}
.stage{
  --u:calc(100cqw / 960);
  position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;
  border-radius:var(--rad);background:var(--paper);color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--line);
  font-size:calc(var(--u) * 18);line-height:1.3;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;outline:none;cursor:pointer;
}
@container (max-width:559px){.stage{--u:calc(100cqw / 540);aspect-ratio:3/4}}
@container (min-width:560px){.stage [data-only=narrow]{display:none!important}}
@container (max-width:559px){.stage [data-only=wide]{display:none!important}}

.slide{position:absolute;inset:0;box-sizing:border-box;padding:calc(var(--u)*30) calc(var(--u)*52) calc(var(--u)*30);
  opacity:0;visibility:hidden;transform:translateX(4%);
  transition:opacity .55s ease,transform .7s cubic-bezier(.2,.75,.2,1),visibility 0s linear .7s}
.slide.past{transform:translateX(-4%)}
.slide.cur{opacity:1;visibility:visible;transform:none;transition:opacity .55s ease .08s,transform .7s cubic-bezier(.2,.75,.2,1) .04s,visibility 0s}
.cv{position:absolute;left:calc(var(--u)*52);top:calc(var(--u)*30);width:calc(var(--u)*856);height:calc(var(--u)*480)}
@container (max-width:559px){.cv{left:calc(var(--u)*32);width:calc(var(--u)*476);height:calc(var(--u)*660)}}

.kick{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;
  border-top:calc(var(--u)*2.5) solid var(--ink);padding-top:calc(var(--u)*8);
  font:700 calc(var(--u)*18)/1 var(--mono);letter-spacing:.06em;color:var(--muted)}
.kick b{color:var(--ink);font-weight:800}
.hd{position:absolute;left:0;right:0;top:calc(var(--u)*40);margin:0;font:800 calc(var(--u)*42)/1.06 var(--disp);letter-spacing:-.03em;color:var(--ink);white-space:nowrap}
@container (max-width:559px){.hd{font-size:calc(var(--u)*38);top:calc(var(--u)*38);white-space:normal;text-wrap:balance}}
.hl{background:linear-gradient(color-mix(in oklab,var(--mark) var(--hlmix),transparent),color-mix(in oklab,var(--mark) var(--hlmix),transparent)) no-repeat 0 90%/0% var(--hlh);transition:background-size .9s cubic-bezier(.3,.7,.2,1) .5s;padding:0 .05em;margin:0 -.05em;color:inherit}
.slide.cur .hl,.hl.on{background-size:100% var(--hlh)}
.mut{color:var(--muted)}
.abs{position:absolute}

.b{opacity:0;transform:translateY(calc(var(--u)*14));transition:opacity .45s ease,transform .6s cubic-bezier(.2,.75,.25,1)}
.b.on{opacity:1;transform:none}
.b:not(.on){pointer-events:none}
.b.reveal{opacity:1;transform:none}
.reveal .ln{clip-path:inset(-20% 100% -20% 0)}
.reveal.on .ln{clip-path:inset(-20% -5% -20% 0);transition:clip-path 1.5s cubic-bezier(.45,.05,.25,1)}
.reveal .mk{opacity:0;transition:opacity .4s}
.reveal.on .mk{opacity:1;transition-delay:1.15s}
.b .mk2{opacity:0;transition:opacity .4s .7s}
.b.on .mk2{opacity:1}
.grow{transform:scaleY(0);transform-box:fill-box;transform-origin:50% 100%;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.growx{transform:scaleX(0);transform-box:fill-box;transform-origin:0 50%;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.on .grow,.on.grow{transform:none}
.on .growx,.on.growx{transform:none}
.draw{stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset 1.3s cubic-bezier(.45,.05,.25,1)}
.slide.cur .draw.auto,.on .draw,.on.draw{stroke-dashoffset:0}
.instant *,.instant *::before,.instant *::after{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){.deck *,.deck *::before,.deck *::after{transition:none!important;animation:none!important}}

.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible;flex:none}
.lb{display:inline-block;width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:50%;vertical-align:middle;margin-left:calc(var(--u)*6);box-sizing:border-box;position:relative;top:-.08em}
.lb.m{background:var(--ink)}
.lb.i{border:calc(var(--u)*1.8) solid var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.lb.g{border:calc(var(--u)*1.8) dashed var(--ink)}
.chip{display:inline-flex;align-items:center;gap:calc(var(--u)*6);font:700 calc(var(--u)*18)/1 var(--mono);padding:calc(var(--u)*5) calc(var(--u)*9);border-radius:calc(var(--u)*30);border:calc(var(--u)*1.8) solid var(--ink);white-space:nowrap}
.chip.guess{border-style:dashed}
.lkey{display:flex;gap:calc(var(--u)*22);align-items:center;font:600 calc(var(--u)*18)/1 var(--disp);color:var(--muted)}
.lkey span{display:inline-flex;align-items:center;gap:calc(var(--u)*8)}
.lkey .lb{margin:0}
.lkey .dl{display:inline-block;width:calc(var(--u)*26);border-top:calc(var(--u)*2.5) dashed var(--ink)}

.chart{position:absolute}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart text{fill:var(--ink);font-family:var(--disp)}
.chart .tk,.chart .mt{fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1.2;opacity:.7}
.c-1{stroke:var(--c1);fill:var(--c1)}
.c-2{stroke:var(--c2);fill:var(--c2)}
.c-3{stroke:var(--c3);fill:var(--c3)}
.c-ink{stroke:var(--ink);fill:var(--ink)}
.hit{fill:transparent;stroke:none;cursor:crosshair}
.xh{stroke:var(--ink);stroke-width:1;opacity:0;pointer-events:none}

.seg{transition:color .3s,opacity .3s,background .3s}
.seg.done{opacity:.45}
.seg.now{color:var(--ink);background:color-mix(in oklab,var(--mark) 26%,transparent);border-radius:4px;box-shadow:0 0 0 3px color-mix(in oklab,var(--mark) 26%,transparent)}
.seg.nx,.seg.later{opacity:.72}
.seg .ck{white-space:nowrap;font:700 .62em/1 var(--mono);font-style:normal;letter-spacing:.05em;color:var(--c1);border:1px solid currentColor;border-radius:4px;padding:.1em .3em;margin-right:.35em;vertical-align:.15em}
.beat{display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--c2);margin:0 .25em;vertical-align:.12em}

.notes{position:absolute;left:0;right:0;bottom:0;max-height:64%;overflow:auto;box-sizing:border-box;
  padding:calc(var(--u)*14) calc(var(--u)*52) calc(var(--u)*20);
  background:color-mix(in oklab,var(--paper) 94%,var(--ink));border-top:calc(var(--u)*2.5) solid var(--ink);
  transform:translateY(102%);transition:transform .4s cubic-bezier(.2,.8,.2,1);cursor:auto;user-select:text;-webkit-user-select:text;z-index:5}
.notes.open{transform:none}
.notes .nh{display:flex;align-items:center;gap:calc(var(--u)*14);font:700 calc(var(--u)*18)/1 var(--mono);color:var(--muted);letter-spacing:.06em;margin-bottom:calc(var(--u)*10)}
.notes .nh .sp{flex:1}
.notes .nh button{all:unset;cursor:pointer;font:700 calc(var(--u)*30)/1 var(--disp);color:var(--ink);padding:0 calc(var(--u)*6)}
.notes .nh button:focus-visible{outline:2px solid var(--c1)}
.notes .tx{margin:0;font:500 max(13px,calc(var(--u)*21))/1.45 var(--disp);max-width:calc(var(--u)*830)}
@container (max-width:559px){.notes{padding:calc(var(--u)*14) calc(var(--u)*32) calc(var(--u)*18)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.tip{position:absolute;z-index:6;pointer-events:none;opacity:0;transition:opacity .15s;min-width:calc(var(--u)*130);
  background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:calc(var(--u)*10);
  box-shadow:0 6px 24px rgba(0,0,0,.16);padding:calc(var(--u)*10) calc(var(--u)*12);font-size:max(13px,calc(var(--u)*18));line-height:1.25}
.tip.show{opacity:1}
.tip .tt{font:700 max(13px,calc(var(--u)*18))/1.2 var(--mono);color:var(--muted);margin-bottom:calc(var(--u)*6)}
.tip .r{display:flex;align-items:center;gap:calc(var(--u)*8);white-space:nowrap}
.tip .r i{display:inline-block;width:calc(var(--u)*16);height:0;border-top:calc(var(--u)*3) solid currentColor}
.tip .r b{font-weight:800;min-width:calc(var(--u)*70)}
.tip .r span{color:var(--muted)}

.bar{display:flex;align-items:center;gap:8px;height:40px;margin-top:8px;font:600 13px/1 var(--mono);color:var(--muted)}
.bar button{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;min-width:30px;padding:0 8px;box-sizing:border-box;
  border:1px solid var(--line);border-radius:calc(var(--rad) * .6);color:var(--ink);font:600 13px/1 var(--mono)}
.bar button:hover{background:color-mix(in oklab,var(--ink) 7%,transparent)}
.bar button:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.bar button[aria-pressed=true]{background:color-mix(in oklab,var(--c1) 18%,transparent);border-color:var(--c1)}
.bar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar kbd{font:600 11px/1 var(--mono);padding:2px 4px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.prog{flex:1;height:4px;border-radius:2px;background:color-mix(in oklab,var(--ink) 12%,transparent);overflow:hidden;min-width:40px}
.prog i{display:block;height:100%;width:0;background:var(--c1);border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.ctr{color:var(--ink);min-width:58px;text-align:center}
@media (max-width:520px){.bar .lbl,.bar kbd{display:none}.bar{gap:5px}}

.pv{display:none;box-sizing:border-box;margin-top:8px;padding:14px 16px 16px;border-radius:var(--rad);background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-family:var(--disp);
  grid-template-columns:minmax(0,1fr) 250px;grid-template-areas:"head head" "script side";gap:12px 18px}
.deck.pvon .pv{display:grid}
.pv-head{grid-area:head;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font:600 13px/1.2 var(--mono);color:var(--muted)}
.pv-head .ttl{font:800 17px/1.2 var(--disp);color:var(--ink);letter-spacing:-.01em;flex:1 1 200px}
.pv-head .stp b,.pv-head .tm b{color:var(--ink);font-weight:800}
.pv-head .tm b.ok{color:var(--c1)}
.pv-head .tm b.warn{color:var(--c2)}
.pv-head .tm b.over{color:var(--red)}
.pv-head button{all:unset;cursor:pointer;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:7px;color:var(--ink);font:600 12px/26px var(--mono)}
.pv-head button:hover{background:color-mix(in oklab,var(--ink) 7%,transparent)}
.pv-head button:focus-visible{outline:2px solid var(--c1)}
.pv-script{grid-area:script;max-height:320px;overflow:auto;font:500 18px/1.55 var(--disp);color:var(--ink);padding-right:6px;scroll-behavior:smooth}
.pv-side{grid-area:side;display:flex;flex-direction:column;gap:8px;font:600 13px/1.3 var(--disp);color:var(--muted)}
.pv-side .lab{font:700 12px/1 var(--mono);letter-spacing:.08em}
.pv-side .nt{color:var(--ink);font-weight:800;font-size:14px}
.pv-side .nw{font-weight:500}
.thumb{position:relative;width:100%;overflow:hidden;border-radius:8px;box-shadow:0 0 0 1px var(--line)}
.thumb .end{display:flex;align-items:center;justify-content:center;height:100%;font:700 13px var(--mono);color:var(--muted)}
.tf{position:absolute;left:0;top:0;width:960px;container-type:inline-size;transform-origin:0 0;pointer-events:none}
.tf .stage{border-radius:0;cursor:default}
.tf *,.tf *::before,.tf *::after{transition:none!important;animation:none!important}
.tf .b,.tf .b.on,.tf .fin{opacity:1!important;transform:none!important}
.tf .grow,.tf .growx{transform:none}
.tf .reveal .ln{clip-path:none}
.tf .reveal .mk,.tf .mk2{opacity:1}
.tf .draw{stroke-dashoffset:0}
.deck.pvon.pvwide{display:grid;grid-template-columns:minmax(0,62fr) minmax(0,38fr);grid-template-rows:auto 1fr;column-gap:16px;align-items:start}
.deck.pvwide .frame,.deck.pvwide .bar{grid-column:1}
.deck.pvwide .pv{grid-column:2;grid-row:1/span 2;margin-top:0;grid-template-columns:1fr;grid-template-areas:"head" "side" "script"}
.deck.pvwide .pv-script{max-height:none}
@media (max-width:620px){.pv{grid-template-columns:1fr;grid-template-areas:"head" "script" "side"}}

.deck:fullscreen{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;--fb-card:#161817;--line:rgba(255,255,255,.18)}
.deck:fullscreen .frame{width:min(100vw,calc((100vh - 56px) * 16 / 9))}
.deck:fullscreen .bar{width:min(100vw,calc((100vh - 56px) * 16 / 9));color:#bbb}
.deck:fullscreen .bar button{color:#eee}
.deck:fullscreen .pv{display:none}
@media (max-width:559px){.deck:fullscreen .frame,.deck:fullscreen .bar{width:min(100vw,calc((100vh - 56px) * 3 / 4))}}

.bar .vo{display:none}
.deck.vshow .bar .vo{display:inline-flex}
.bar #bplay{background:var(--c1);border-color:var(--c1);color:#fff;padding:0 12px 0 9px;font-weight:700;min-width:84px}
.bar #bplay:hover{background:color-mix(in oklab,var(--c1) 86%,#000)}
.bar #bplay svg{fill:currentColor;stroke:none}
#bplay .ip,.deck[data-vp=play] #bplay .il,.deck[data-vp=count] #bplay .il{display:none}
.deck[data-vp=play] #bplay .ip,.deck[data-vp=count] #bplay .ip{display:block}
.vmeter{align-items:center;gap:2px;height:20px;padding:0 3px}
.vmeter i{display:block;width:3px;height:16px;border-radius:2px;background:var(--c1);transform:scaleY(.12);transition:transform .07s linear,opacity .3s}
.deck:not([data-vp=play]) .vmeter i{opacity:.4}
#bpv[data-voice]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--c1)}
#bpv[data-voice=loading]::after{background:var(--muted);animation:vpulse .9s ease-in-out infinite alternate}
#bpv[data-voice=none]::after,#bpv[data-voice=failed]::after{display:none}
@keyframes vpulse{from{opacity:.2}to{opacity:1}}
.deck.vshow #pvr{display:none}
@media (max-width:520px){.deck.vshow .bar .prog{display:none}.bar #bplay{min-width:0}}
.vprog{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:8;pointer-events:none;opacity:0;transition:opacity .5s}
.deck.vshow .vprog{opacity:1}
.vprog i{display:block;height:100%;background:var(--c1);transform:scaleX(0);transform-origin:0 50%}
.vcap{position:absolute;left:50%;bottom:calc(var(--u)*22);transform:translateX(-50%);width:max-content;max-width:82%;z-index:7;display:none;pointer-events:none;box-sizing:border-box;
  padding:calc(var(--u)*8) calc(var(--u)*14);border-radius:calc(var(--u)*10);background:color-mix(in oklab,var(--ink) 86%,transparent);color:var(--paper);
  font:600 max(13px,calc(var(--u)*22))/1.3 var(--disp);text-align:center;text-wrap:balance}
.deck.vshow.vcapon .vcap:not(:empty){display:block}
.vov{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;pointer-events:none;cursor:auto}
.deck.vshow .vov{display:flex}
.vov>*{display:none}
.vov[data-s=count],.vov[data-s=prep],.vov[data-s=blocked]{background:color-mix(in oklab,var(--paper) 74%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.vov[data-s=pause]{background:color-mix(in oklab,var(--paper) 30%,transparent)}
.vov[data-s=count] .vcd{display:flex}
.vcd{width:calc(var(--u)*150);height:calc(var(--u)*150);border-radius:50%;align-items:center;justify-content:center;font:900 calc(var(--u)*84)/1 var(--disp);color:var(--c1);box-shadow:inset 0 0 0 calc(var(--u)*3) var(--c1)}
.vcd.go{animation:vbreath .56s cubic-bezier(.2,.7,.2,1) both}
@keyframes vbreath{0%{transform:scale(.72);opacity:0}35%{opacity:1}100%{transform:scale(1.05);opacity:.92}}
.vov[data-s=prep] .vmsg{display:block;font:700 max(12px,calc(var(--u)*20))/1 var(--mono);color:var(--muted);letter-spacing:.06em}
.vov[data-s=blocked] .vbig,.vov[data-s=pause] .vbig{display:flex}
.vbig{all:unset;display:none;position:absolute;inset:0;pointer-events:auto;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*14);font:700 max(13px,calc(var(--u)*22))/1 var(--mono);letter-spacing:.04em;color:var(--ink)}
.vbig svg{width:max(64px,calc(var(--u)*104));height:max(64px,calc(var(--u)*104));padding:max(18px,calc(var(--u)*28));box-sizing:border-box;border-radius:50%;background:var(--c1);fill:#fff;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.vov[data-s=pause] .vbig svg{width:max(52px,calc(var(--u)*80));height:max(52px,calc(var(--u)*80));padding:max(15px,calc(var(--u)*22));opacity:.92}
.vov[data-s=pause] .vbig span{display:none}
.vbig:focus-visible svg{outline:3px solid var(--ink);outline-offset:3px}
.vov[data-s=end] .vend{display:flex;position:absolute;right:calc(var(--u)*20);bottom:calc(var(--u)*20);align-items:center;gap:10px;pointer-events:auto;padding:5px 5px 5px 14px;border-radius:999px;
  background:color-mix(in oklab,var(--paper) 90%,var(--ink));box-shadow:0 0 0 1px var(--line);font:800 13px/1 var(--mono);letter-spacing:.08em;color:var(--c1);animation:vin .7s ease both}
.vend button{all:unset;cursor:pointer;font:700 12px/1 var(--mono);padding:8px 12px;border-radius:999px;background:var(--c1);color:#fff}

bnotes.addEventListener("click",function(e){e.stopPropagation();toggleNotes();});
document.getElementById("ncl").addEventListener("click",function(e){e.stopPropagation();toggleNotes(false);});
bpv.addEventListener("click",function(e){e.stopPropagation();presenter();});
document.getElementById("bfs").addEventListener("click",function(e){e.stopPropagation();toggleFs();});

var swiped=false;
stage.addEventListener("click",function(e){
  if(swiped){swiped=false;return;}
  if(e.target.closest("button,.notes,a"))return;
  var r=stage.getBoundingClientRect();
  if(e.clientX-r.left<r.width*0.3)prev();else next();
  stage.focus({preventScroll:true});
});
var tx=0,ty=0;
stage.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;},{passive:true});
stage.addEventListener("touchend",function(e){var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){swiped=true;if(dx<0)next();else prev();setTimeout(function(){swiped=false;},400);}},{passive:true});
document.addEventListener("keydown",function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var k=e.key,onBtn=e.target&&e.target.closest&&e.target.closest("button");
  if(phase!=="off"&&(k===" "||k==="k"||k==="K")){if(k!==" "||!onBtn){e.preventDefault();togglePlay();}}
  else if(phase!=="off"&&(k==="Home"||k==="End")){e.preventDefault();jumpSlide(k==="Home"?0:N-1);}
  else if(k==="c"||k==="C"){deck.classList.toggle("vcapon");}
  else if(k==="ArrowRight"||k==="PageDown"||(k===" "&&!onBtn)){e.preventDefault();next();}
  else if(k==="ArrowLeft"||k==="PageUp"){e.preventDefault();prev();}
  else if(k==="Home"){e.preventDefault();go(0,0);}
  else if(k==="End"){e.preventDefault();go(N-1,"all");}
  else if(k==="n"||k==="N"){toggleNotes();}
  else if(k==="p"||k==="P"){presenter();}
  else if(k==="f"||k==="F"){toggleFs();}
  else if(k==="Escape"){if(phase!=="off")stopShow();else if(notes.classList.contains("open"))toggleNotes(false);else if(pvOn)togglePV(false);}
});

/* voiced show: the audio clock owns slide and build while it runs */
var audio=document.getElementById("vaudio"),vov=document.getElementById("vov"),vcd=document.getElementById("vcd"),vcap=document.getElementById("vcap"),vpi=document.getElementById("vpi");
var bpl=document.getElementById("bpl"),mbars=[].slice.call(document.querySelectorAll("#vmeter i"));
var phase="off",vstate="none",ctx=null,an=null,fb=null,direct=false,unlocked=false,hold=0,raf=0,cdT=0,pend=null,rate=1,kG=-2,kW=-1;
var BANDS=[[1,3],[3,5],[5,8],[8,13],[13,22]];

function wnorm(w){return w.toLowerCase().replace(/\(pause\)/g,"").replace(/[^a-z0-9à-ÿ$]/g,"");}
function tokens(t){
  var out=[],bold=false;
  t.split(/\s+/).forEach(function(raw){
    if(!raw)return;var h="";
    raw.split("**").forEach(function(p,ix){if(ix)bold=!bold;if(p){var q=esc(p).replace(/\(pause\)/g,'<i class="beat" title="pause"></i>');h+=bold?"<b>"+q+"</b>":q;}});
    var plain=raw.replace(/\*\*|\(pause\)/g,"");
    out.push({h:h,n:wnorm(plain),p:plain,l:-1});
  });
  return out;
}
/* map manifest lines onto display words: expected length, snapped to the line's last word */
function align(tok,L,g0,lines){
  var W=[];tok.forEach(function(x,ix){if(x.n)W.push(ix);});
  var p=0;
  L.forEach(function(l,j){
    var lw=String(l.text||"").replace(/<[^>]*>|\[[^\]]*\]/g," ").split(/\s+/).map(wnorm).filter(Boolean);
    var e=W.length-1;
    if(j<L.length-1){
      var tg=p+lw.length-1,last=lw[lw.length-1],best=-1;
      for(var d=0;d<=6&&best<0;d++)[tg-d,tg+d].forEach(function(c){if(best<0&&c>=p&&c<W.length-1&&tok[W[c]].n===last)best=c;});
      e=best>=0?best:Math.min(W.length-2,tg);
    }
    for(var c=p;c<=e&&c<W.length;c++)tok[W[c]].l=g0+j;
    p=Math.max(p,e+1);
  });
  var prev=-1;tok.forEach(function(x){if(x.l<0&&L.length)x.l=prev>=0?prev:g0;prev=x.l;});
  tok.forEach(function(x){if(x.l<0||!x.n)return;var ln=lines[x.l];ln.cw.push(ln.tw);ln.tw+=x.n.length;ln.wc++;});
  for(var g=g0;g<lines.length;g++)lines[g].cap=tok.filter(function(x){return x.l===g;}).map(function(x){return x.p;}).join(" ").replace(/\s+/g," ").trim();
  return tok;
}
function buildVO(m){
  if(!m||!m.slides||!m.slides.length)return null;
  var vo={dur:+m.duration||0,start:[],steps:[],lines:[],first:[],last:[],tok:[],audio:m.audio||{}};
  for(var i=0;i<N;i++){
    var ms=m.slides.filter(function(x){return x.slide===i+1;})[0],segs=ms?ms.segments.slice().sort(function(a,b){return a.k-b.k;}):[];
    vo.start[i]=segs.length?+segs[0].start:null;
    vo.steps[i]=segs.map(function(s){return +s.start;});
    vo.first[i]=vo.lines.length;vo.tok[i]=[];
    PITCH[i].segments.forEach(function(text,k){
      var sg=segs.filter(function(s){return s.k===k;})[0],L=(sg&&sg.lines)||[],g0=vo.lines.length;
      L.forEach(function(l){vo.lines.push({i:i,k:k,s:+l.start,e:+l.end,cw:[],tw:0,wc:0,cap:""});});
      vo.tok[i][k]=align(tokens(text),L,g0,vo.lines);
    });
    vo.last[i]=vo.lines.length-1;
  }
  for(var j=N-1;j>=0;j--)if(vo.start[j]==null)vo.start[j]=j<N-1?vo.start[j+1]:vo.dur;
  if(!vo.dur)vo.dur=vo.lines.length?vo.lines[vo.lines.length-1].e:1;
  return vo;
}
var VO=null;try{VO=buildVO(JSON.parse(document.getElementById("voice").textContent));}catch(e){VO=null;}
function tokHTML(tk){
  var g=[];tk.forEach(function(x){var last=g[g.length-1];if(!last||last.l!==x.l)g.push(last={l:x.l,p:[]});last.p.push(x.n?'<span class="w">'+x.h+"</span>":x.h);});
  return g.map(function(x){return '<span class="ln" data-l="'+x.l+'">'+x.p.join(" ")+"</span>";}).join(" ");
}
function locate(t){
  var i=0,k=0;for(var j=0;j<N;j++)if(VO.start[j]<=t+1e-3)i=j;
  var st=VO.steps[i];for(var m=1;m<st.length;m++)if(st[m]<=t+1e-3)k=m;
  return{i:i,k:k};
}

function karaoke(t){
  var g=-1;for(var j=VO.first[cur];j<=VO.last[cur];j++){if(VO.lines[j].s<=t)g=j;else break;}
  var L=g>=0?VO.lines[g]:null,w=0;
  if(L){if(t>=L.e)w=L.wc;else{var f=(t-L.s)/Math.max(.01,L.e-L.s)*L.tw;while(w<L.wc&&L.cw[w]<=f)w++;}}
  var bx=[notes,document.getElementById("pvsc")];
  if(g!==kG){
    kG=g;kW=-1;
    bx.forEach(function(b){
      [].forEach.call(b.querySelectorAll(".ln"),function(e){var l=+e.getAttribute("data-l");e.classList.toggle("lp",l<g);e.classList.toggle("lc",l===g);});
      scrollAt(b,b.querySelector(".ln.lc"));
    });
    vcap.textContent=L?L.cap:"";
  }
  if(w!==kW){kW=w;bx.forEach(function(b){var ws=b.querySelectorAll(".ln.lc .w");for(var x=0;x<ws.length;x++)ws[x].classList.toggle("sd",x<w);});}
  return L&&t<L.e;
}
function meter(speaking,t){
  var lv=[0,0,0,0,0];
  if(phase==="play"){
    if(an){an.getByteFrequencyData(fb);BANDS.forEach(function(b,j){var s=0;for(var x=b[0];x<b[1];x++)s+=fb[x];lv[j]=s/(b[1]-b[0])/255;});}
    else if(speaking)lv=lv.map(function(_,j){return .4+.3*Math.sin(t*(6.3+j*2.1)+j)*Math.sin(t*2.7+j*1.3);});
    if(reduce.matches)lv=lv.map(function(v){return v>.05?.55:0;});
  }
  mbars.forEach(function(e,j){e.style.transform="scaleY("+(.12+.88*Math.min(1,lv[j]*1.35)).toFixed(3)+")";});
}
function vFrame(still){
  var t=audio.currentTime;
  if(!still&&(phase==="play"||phase==="pause")){
    var l=locate(t);if(l.i<hold)l={i:hold,k:0};hold=l.i;
    if(l.i!==cur){go(l.i,l.k);return;}
    var k=Math.min(l.k,visibleBuildMax(cur));if(k>step){step=k;apply(false);return;}
  }
  meter(karaoke(t),t);
  vpi.style.transform="scaleX("+Math.min(1,t/VO.dur).toFixed(4)+")";
}
function loop(){cancelAnimationFrame(raf);(function f(){if(phase!=="play")return;vFrame(false);raf=requestAnimationFrame(f);})();}

function setPhase(p){
  phase=p;deck.classList.toggle("vshow",p!=="off");deck.setAttribute("data-vp",p);vov.setAttribute("data-s",p);
  bpl.textContent=p==="end"?"Replay":p==="play"||p==="count"?"Pause":"Play";
  bpv.setAttribute("aria-pressed",p!=="off"||pvOn?"true":"false");
  if(p!=="play")cancelAnimationFrame(raf);
  tick();
}
function seek(t){pend=t;try{audio.currentTime=t;if(audio.readyState>0)pend=null;}catch(e){}}
audio.addEventListener("loadedmetadata",function(){if(pend!=null){try{audio.currentTime=pend;}catch(e){}pend=null;}});
function wireCtx(){
  if(direct||an)return;
  var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{if(!ctx){ctx=new AC();ctx.onstatechange=function(){if(an&&ctx.state!=="running"&&phase==="play"){audio.pause();setPhase("blocked");}};}}catch(e){return;}
  function wire(){
    if(an||ctx.state!=="running")return;
    try{var s=ctx.createMediaElementSource(audio);an=ctx.createAnalyser();an.fftSize=256;an.smoothingTimeConstant=.72;s.connect(an);an.connect(ctx.destination);fb=new Uint8Array(an.frequencyBinCount);}catch(e){an=null;}
  }
  if(ctx.state==="running")wire();else{var p;try{p=ctx.resume();}catch(e){}if(p&&p.then)p.then(wire,function(){});}
}
function resumeCtx(){if(ctx&&ctx.state!=="running")try{ctx.resume();}catch(e){}}
/* a muted play() inside the gesture unlocks the element for the delayed start after the count-in (iOS) */
function unlock(){
  if(unlocked||!audio.src)return;unlocked=true;audio.muted=true;
  var p;try{p=audio.play();}catch(e){}
  if(p&&p.then)p.then(function(){if(phase!=="play")audio.pause();audio.muted=false;},function(){audio.muted=false;unlocked=false;});else audio.muted=false;
}
function playNow(){
  clearTimeout(cdT);audio.muted=false;audio.playbackRate=rate;resumeCtx();
  setPhase("play");loop();
  var p;try{p=audio.play();}catch(e){p=null;setPhase("blocked");}
  if(p&&p.catch)p.catch(function(){if(phase==="play"){setPhase("blocked");vFrame(true);}});
}
function countIn(t){
  seek(t);hold=cur;
  if(reduce.matches){playNow();return;}
  setPhase("count");clearTimeout(cdT);
  var n=3;(function f(){
    if(phase!=="count")return;
    if(!n){seek(t);playNow();return;}
    vcd.textContent=n;vcd.classList.remove("go");void vcd.offsetWidth;vcd.classList.add("go");n--;cdT=setTimeout(f,560);
  })();
}
function startShow(){
  if(vstate==="none"||vstate==="failed"){togglePV();return;}
  wireCtx();unlock();
  if(!pvOn)togglePV(true);
  hold=cur;go(cur,0);
  if(vstate!=="ready"){setPhase("prep");return;}
  countIn(VO.start[cur]);
}
function stopShow(){clearTimeout(cdT);audio.pause();setPhase("off");togglePV(false);vcap.textContent="";apply(false);}
function presenter(){if(phase!=="off")stopShow();else startShow();}
function togglePlay(){
  if(phase==="play"){audio.pause();setPhase("pause");vFrame(true);}
  else if(phase==="count"){clearTimeout(cdT);setPhase("pause");}
  else if(phase==="pause"||phase==="blocked"){wireCtx();playNow();}
  else if(phase==="end")jumpSlide(0);
}
function jumpSlide(i){
  if(phase==="off"||i<0||i>=N)return;
  hold=i;go(i,0);seek(VO.start[i]);
  if(phase==="prep"||phase==="count")return;
  wireCtx();playNow();
}
audio.addEventListener("ended",function(){if(phase==="off")return;hold=N-1;go(N-1,"all");setPhase("end");vpi.style.transform="scaleX(1)";meter(false,0);});
audio.addEventListener("error",function(){if(!audio.getAttribute("src"))return;setV("failed");if(phase!=="off"){clearTimeout(cdT);setPhase("off");}});
document.getElementById("bplay").addEventListener("click",function(e){e.stopPropagation();togglePlay();});
document.getElementById("vbig").addEventListener("click",function(e){e.stopPropagation();togglePlay();});
document.getElementById("vrep").addEventListener("click",function(e){e.stopPropagation();jumpSlide(0);});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&phase==="play"){resumeCtx();vFrame(false);}});

function setV(s){vstate=s;bpv.setAttribute("data-voice",s);if(s==="loading")bpv.setAttribute("aria-busy","true");else bpv.removeAttribute("aria-busy");}
/* direct means no Web Audio analyser: a file: or cross-origin source would play silent through it, and a data: source might in some engines */
/* a packed PNG carries the audio bytes in its RGB channels: a 4-byte big-endian length, then the bytes */
function unpack(src,ok,bad){
  var im=new Image();
  im.onload=function(){
    try{
      var w=im.naturalWidth,h=im.naturalHeight,cv=document.createElement("canvas");cv.width=w;cv.height=h;
      var x=cv.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0);
      var d=x.getImageData(0,0,w,h).data,n=((d[0]<<24)|(d[1]<<16)|(d[2]<<8)|d[4])>>>0;
      if(n<16||n>w*h*3-4)throw new Error("length");
      var out=new Uint8Array(n),q=0;
      for(var i=0;q<n+4;i++){if((i&3)===3)continue;if(q>=4)out[q-4]=d[i];q++;}
      cv.width=cv.height=0;
      if(String.fromCharCode(out[4],out[5],out[6],out[7])!=="ftyp")throw new Error("ftyp");
      ok(URL.createObjectURL(new Blob([out],{type:"audio/mp4"})));
    }catch(e){bad();}
  };
  im.onerror=bad;im.src=src;
}
function probeDirect(src,ok,bad){
  var a=new Audio(),done=false,to=setTimeout(function(){fin(bad);},5000);
  function fin(f){if(done)return;done=true;clearTimeout(to);a.removeAttribute("src");f(src);}
  a.preload="metadata";a.onloadedmetadata=function(){fin(ok);};a.onerror=function(){fin(bad);};a.src=src;
}
function loadVoice(){
  if(!VO){setV("none");return;}
  setV("loading");
  var A=VO.audio,png=A.png,m4a=A.m4a,tries=[];
  if(/^data:/.test(m4a||""))direct=true;
  var viaPng=png?function(ok,bad){unpack(png,ok,bad);}:null,viaM4a=m4a?function(ok,bad){probeDirect(m4a,function(u){direct=/^data:/.test(u)||location.protocol==="file:"||new URL(u,location.href).origin!==location.origin;ok(u);},bad);}:null;
  if(png&&(/^data:/.test(png)||/[?&]voice=png/.test(location.search)))tries=[viaPng,viaM4a];else tries=[viaM4a,viaPng];
  tries=tries.filter(Boolean);
  (function next(j){
    if(j>=tries.length){setV("failed");if(phase==="prep")setPhase("off");return;}
    tries[j](function(url){audio.src=url;try{audio.load();}catch(e){}setV("ready");if(phase==="prep")countIn(VO.start[cur]);},function(){next(j+1);});
  })(0);
}

function layout(force){
  layoutPV();
  var nw=frame.clientWidth<560;
  if(nw!==narrow||force){narrow=nw;drawAll();fitHeads();if(started){step=Math.min(step,visibleBuildMax(cur));
    [].forEach.call(slides[cur].querySelectorAll("[data-b].on"),function(e){e.classList.remove("on");});apply(false);}}
}
if(window.ResizeObserver)new ResizeObserver(function(){layout(false);}).observe(deck);
window.addEventListener("resize",function(){layout(false);});
var mq=window.matchMedia("(prefers-color-scheme: dark)");
if(mq.addEventListener)mq.addEventListener("change",detectMode);
new MutationObserver(detectMode).observe(document.documentElement,{attributes:true,attributeFilter:["class","style","data-theme"]});

function checkSync(){
  var bad=[];
  if(PITCH.length!==N)bad.push("script has "+PITCH.length+" slides, deck "+N);
  slides.forEach(function(s,i){if(!PITCH[i])return;var want=PITCH[i].segments.length-1,have=visibleBuildMax(i);if(want!==have)bad.push((i+1)+": deck "+have+", script "+want);});
  if(bad.length)console.error("build count differs from the [click] count. "+bad.join("; "));
  return bad;
}

detectMode();
if(HOOK.init)HOOK.init(api);
narrow=frame.clientWidth<560;drawAll();fitHeads();
checkSync();
var hs=location.hash||"",h=parseInt(hs.replace(/\D/g,""),10);
requestAnimationFrame(function(){requestAnimationFrame(function(){go(h>0?h-1:0,0);if(/pv/.test(hs))togglePV(true);setTimeout(loadVoice,60);});});

window.__deck={go:go,next:next,prev:prev,count:N,state:function(){return{cur:cur,step:step,max:visibleBuildMax(cur),narrow:narrow,notes:notes.classList.contains("open"),pv:pvOn};},
  builds:function(){return slides.map(function(s,i){return visibleBuildMax(i);});},script:function(){return PITCH;},checkSync:checkSync,
  instant:function(on){deck.classList.toggle("instant",!!on);},notes:toggleNotes,presenter:togglePV,
  voice:{state:function(){return{phase:phase,voice:vstate,t:audio.currentTime,paused:audio.paused,analyser:!!an,ctx:ctx?ctx.state:null,direct:direct,line:kG,cap:vcap.textContent};},
    audio:audio,manifest:function(){return VO;},start:startShow,stop:stopShow,toggle:togglePlay,jump:jumpSlide,rate:function(r){rate=r;audio.playbackRate=r;}}};
})();
</script>
